name: Protected private pipeline context
description: Materialize explicit cached inputs and use only the environment's federated Azure CLI identity.
inputs:
  inputs:
    description: Comma-separated private inputs to materialize (settings, tfvars, backend)
    default: settings
runs:
  using: composite
  steps:
    - name: Require trusted protected dispatch and isolated private runner
      shell: pwsh
      env:
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        STUDIO_INPUTS: ${{ inputs.inputs }}
      run: |
        if ($env:GITHUB_EVENT_NAME -ne 'workflow_dispatch' -or
            $env:GITHUB_REF -ne "refs/heads/$env:DEFAULT_BRANCH" -or
            $env:GITHUB_REF_PROTECTED -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'self-hosted') {
          throw 'Only protected default-branch manual dispatches on approved ephemeral private runners are allowed.'
        }
        ./scripts/ci/Write-StudioPipelineInputs.ps1 -Directory $env:RUNNER_TEMP -Inputs ($env:STUDIO_INPUTS -split ',')
        "AZURE_CONFIG_DIR=$(Join-Path $env:RUNNER_TEMP 'studio-azure')" >> $env:GITHUB_ENV
        "DOCKER_CONFIG=$(Join-Path $env:RUNNER_TEMP 'studio-docker')" >> $env:GITHUB_ENV
    - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: Build shared contract validator and install locked pipeline I/O
      shell: pwsh
      run: |
        dotnet build tools/VideoSafetyStudio.Contracts --artifacts-path "$env:RUNNER_TEMP/contracts" -v quiet
        if ($LASTEXITCODE) { throw 'Contract validator build failed.' }
        "STUDIO_CONTRACT_TOOL=$env:RUNNER_TEMP/contracts/bin/VideoSafetyStudio.Contracts/debug/VideoSafetyStudio.Contracts.dll" >> $env:GITHUB_ENV
        python -m pip install --require-hashes -r scripts/ci/requirements.lock
        if ($LASTEXITCODE) { throw 'Locked pipeline dependencies failed.' }
        # build/gpu/prepare.py, models.py and verify.py run under this same interpreter and import its tracing packages.
        python -m pip install --require-hashes -r build/gpu/requirements-build.lock
        if ($LASTEXITCODE) { throw 'Locked GPU build tool dependencies failed.' }
    - uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
      with:
        client-id: ${{ env.AZURE_CLIENT_ID }}
        tenant-id: ${{ env.AZURE_TENANT_ID }}
        subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
