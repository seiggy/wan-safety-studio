name: Build immutable artifact
on:
  workflow_dispatch:
    inputs:
      component:
        description: Independent artifact (GPU fetches and verifies its pinned source and weights unless runner caches are set; trainer fetches pinned weights)
        type: choice
        options: [server, gpu, yolox]
        default: server
        required: true
permissions:
  contents: read
concurrency:
  group: studio-publishing-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, x64, wan-private]
    environment: studio-build
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    env:
      PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple
      PIP_EXTRA_INDEX_URL: ""
      NPM_CONFIG_REGISTRY: https://packagefeedproxy.microsoft.io/npm/
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      STUDIO_SETTINGS_JSON: ${{ secrets.STUDIO_SETTINGS_JSON }}
      STUDIO_SETTINGS_PATH: ${{ secrets.STUDIO_SETTINGS_PATH }}
      COMPONENT: ${{ inputs.component }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/private-context
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build, CPU-check and seal only the selected artifact
        shell: pwsh
        env:
          STUDIO_UPSTREAM_SOURCE: ${{ vars.STUDIO_UPSTREAM_SOURCE }}
          STUDIO_MODEL_CACHE: ${{ vars.STUDIO_MODEL_CACHE }}
          STUDIO_LICENSE_CACHE: ${{ vars.STUDIO_LICENSE_CACHE }}
          STUDIO_APPROVE_TRAINER_WEIGHTS: ${{ vars.STUDIO_APPROVE_TRAINER_WEIGHTS }}
          STUDIO_NPMRC: ${{ vars.STUDIO_NPMRC }}
          STUDIO_NUGET_CONFIG: ${{ vars.STUDIO_NUGET_CONFIG }}
          STUDIO_NETRC: ${{ vars.STUDIO_NETRC }}
        run: |
          python scripts/ci/build_image.py --component "$env:COMPONENT" --settings "$env:RUNNER_TEMP/settings.json" --work "$env:RUNNER_TEMP/build"
          if ($LASTEXITCODE) { throw 'Artifact was not sealed.' }
      - name: Remove short-lived credentials
        if: always()
        shell: pwsh
        run: |
          foreach ($name in @('studio-azure','studio-docker')) {
            $path = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path -LiteralPath $path) { Remove-Item -LiteralPath $path -Recurse -Force }
          }
