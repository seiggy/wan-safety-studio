name: Docs

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Point lockfile at the public registry (workspace only)
        run: |
          node -e "const fs=require('fs');const f='package-lock.json';fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace(/https:\/\/[^\"]*\/npm\/registry\//g,'https://registry.npmjs.org/'))"
      - run: npm ci
      - run: npm run build
      - run: node scripts/check-prose.mjs
      - name: npm audit (report only)
        continue-on-error: true
        run: npm audit --audit-level=high
