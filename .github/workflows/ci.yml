name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The repo's nuget.config, web/.npmrc and package-lock.json point at an internal
# Microsoft feed that public runners cannot reach. CI overrides that without
# committing anything: NuGet via --source, npm via an env registry plus a lockfile
# URL rewrite in the runner workspace only.
env:
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  dotnet:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests\VideoSafetyStudio.Tests --source $env:NUGET_SOURCE
      - name: Build
        run: dotnet build tests\VideoSafetyStudio.Tests --no-restore --configuration Release --artifacts-path .artifacts-ci
      - name: Test
        run: dotnet test tests\VideoSafetyStudio.Tests --no-build --configuration Release --artifacts-path .artifacts-ci
      - name: Vulnerable packages (report only)
        continue-on-error: true
        run: dotnet list tests\VideoSafetyStudio.Tests package --vulnerable --include-transitive --source $env:NUGET_SOURCE

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Point lockfile at the public registry (workspace only)
        run: |
          node -e "const fs=require('fs');const f='package-lock.json';fs.writeFileSync(f,fs.readFileSync(f,'utf8').replace(/https:\/\/[^\"]*\/npm\/registry\//g,'https://registry.npmjs.org/'))"
      - run: npm ci
      - run: npm run build
      - run: npx vitest run
      - name: npm audit (report only)
        continue-on-error: true
        run: npm audit --audit-level=high

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned operator dependencies
        run: |
          python -c "import tomllib;print('\n'.join(tomllib.load(open('azureml/pyproject.toml','rb'))['project']['dependencies']))" > "$RUNNER_TEMP/req.txt"
          python -m pip install -r "$RUNNER_TEMP/req.txt"
      - name: Control tests
        run: python azureml/test_controls.py --scratch "$RUNNER_TEMP/tc"

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
      - run: terraform test
