name: TEMP relogin probe (remove before merge)
on:
  push:
    branches: [seiggy-promotion-az-cli-token-refresh]
    paths: [.github/workflows/zz-temp-relogin-probe.yml, scripts/ci/pipeline.py]
permissions:
  contents: read
  id-token: write
env:
  PIP_INDEX_URL: https://packagefeedproxy.microsoft.io/pypi/simple
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --require-hashes -r scripts/ci/requirements.lock
          python -m pip install --require-hashes -r build/gpu/requirements-build.lock
          az version -o tsv --query '"azure-cli"'
      - name: Patched run() against real GitHub OIDC and real Entra (pwsh step, like promote.yml)
        shell: pwsh
        run: |
          @'
          import base64, json, os, sys, urllib.request
          sys.path.insert(0, "scripts/ci")
          import pipeline

          print("OIDC request env visible to the python child:", bool(os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL") and os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN")))
          seen, calls, real_open, real_invoke = {}, [], urllib.request.urlopen, pipeline._invoke

          def opener(request, timeout):
              body = real_open(request, timeout=timeout).read()
              token = json.loads(body)["value"]
              claims = json.loads(base64.urlsafe_b64decode(token.split(".")[1] + "=="))
              seen.update(token=token, aud=claims["aud"], iss=claims["iss"], lifetime=claims["exp"] - claims["iat"])
              import io
              return io.BytesIO(body)

          def invoke(args, input):
              program, result = real_invoke(args, input)
              calls.append(" ".join(str(a) for a in args[:3]))
              if args[1] == "acr":  # stand-in for the expired-assertion az failure seen in run 41458043021
                  result.returncode, result.stderr = 1, "WARNING: Unable to get AAD authorization tokens with message: AADSTS700024: Client assertion is not within its valid time range."
              return program, result

          pipeline.urllib.request.urlopen, pipeline._invoke = opener, invoke
          # A tenant/client that does not trust this repo: the real az login must reach Entra, fail, and not recurse.
          pipeline.FEDERATED_LOGIN = ("11111111-1111-1111-1111-111111111111", "22222222-2222-2222-2222-222222222222", "33333333-3333-3333-3333-333333333333")
          try:
              pipeline.run("az", "acr", "login", "--name", "probenonexistent0000", "--expose-token")
              raise SystemExit("UNEXPECTED: success")
          except RuntimeError as error:
              message = str(error)
          print("assertion aud/iss/lifetime(s):", seen["aud"], seen["iss"], seen["lifetime"])
          print("az invocations in order:", calls)
          print("final error:", message)
          assert calls == ["az acr login", "az login --service-principal"], calls
          assert seen["aud"] == "api://AzureADTokenExchange"
          assert message.startswith("az login failed") and "AADSTS" in message, message
          assert seen["token"] not in message and seen["token"][:40] not in message, "assertion leaked"
          print("PROBE PASSED")
          '@ | python -
          if ($LASTEXITCODE) { throw 'Probe failed.' }
